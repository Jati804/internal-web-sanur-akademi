<style>
    html, body {
      height: 100%;
    }
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #FDFDFF; 
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { 
          background: #2563eb; 
          border-radius: 10px; 
        }
        
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(8px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        @media (max-width: 768px) {
            input, select, textarea { font-size: 16px !important; }
            .mobile-card-grid { grid-template-columns: 1fr !important; }

            /* 🆕 FIX MODAL KEPOTONG DI HP: semua modal (GuideModal, Hapus
               Sesi, Edit Sesi, dll) dibungkus ModalPortal + [data-modal-container]
               yang di-center pakai flexbox (align-items:center). Kalau HP
               landscape-nya kependekan (dipaksa landscape sama PortraitBlocker,
               ditambah bug "vh" khas browser mobile), modal yang lebih tinggi
               dari layar jadi kepotong atas/bawah TANPA bisa digeser sama
               sekali, jadi tombol close/aksi di bawah nggak kepencet.
               Cuma khusus HP (max-width: 768px) — PC/laptop/tablet nggak
               kesentuh, tetap 100% sama kayak sekarang.
               Caranya: parent tetap flex, tapi ganti dari "align-items:center"
               (yang bikin overflow-nya nggak bisa discroll) jadi
               "align-items:flex-start" + overflow-y:auto, sementara modal-nya
               sendiri dikasih margin:auto biar TETAP keliatan center kalau
               muat di layar. Begitu kepanjangan dikit, tinggal geser jari
               (scroll native bawaan browser, BUKAN auto-scroll JS) buat
               nampilin bagian yang kepotong. */
            [data-modal-container] {
                align-items: flex-start !important;
                overflow-y: auto !important;
                -webkit-overflow-scrolling: touch;
            }
            [data-modal-container] > * {
                margin-top: auto !important;
                margin-bottom: auto !important;
            }
        }
        .safe-pb { padding-bottom: env(safe-area-inset-bottom); }
    </style>

<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script>
      // 🎯 AUTO REDIRECT - FUTURE PROOF!
      // Hanya redirect di domain Vercel (.vercel.app)
      const isVercelDomain = window.location.hostname.includes('vercel.app');
      if (isVercelDomain && (window.location.hash === '' || window.location.hash === '#/')) {
        window.location.hash = '#/verify';
      }
    </script>
    <script type="module" src="/index.tsx"></script>
<script>
  // Service Worker hanya register di NON-Vercel domain
  const isVercelDomainSW = window.location.hostname.includes('vercel.app');
  
  if (!isVercelDomainSW && 'serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker
        .register('/sw.js')
        .then(reg => console.log('✅ SW registered:', reg))
        .catch(err => console.log('❌ SW failed:', err));
    });
  }
</script>
